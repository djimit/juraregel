# JuraRegel — Full stack: PostgreSQL + Qdrant + Keycloak + API + Dashboard
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose up -d postgres     # Start only PostgreSQL
#   docker compose down               # Stop all
#   docker compose logs -f api        # Follow API logs
#
# Services:
#   postgres   — Multi-tenant database with RLS
#   qdrant     — Vector store for RAG pipeline
#   keycloak   — OAuth2 / OIDC authentication
#   api        — JuraRegel REST API (FastAPI)
#   dashboard  — JuraRegel Compliance Dashboard (Next.js)

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  # Uses existing PostgreSQL on host (port 5432 already in use)
  # Create a dedicated database in the existing instance
  # No container needed — we connect to the host's PostgreSQL

  # ─── Qdrant Vector Store ──────────────────────────────────
  # Uses existing Qdrant on host (port 6333 already in use)
  # No container needed — we connect to the host's Qdrant

  # ─── JuraRegel API ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: juraregel-api
    ports:
      - "127.0.0.1:${JURAREGEL_API_PORT:-8096}:8080"
    environment:
      JURAREGEL_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      QDRANT_URL: ${QDRANT_URL:?QDRANT_URL is required}
      KEYCLOAK_URL: ${KEYCLOAK_URL:?KEYCLOAK_URL is required}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-juraregel}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-juraregel-api}
      JURAREGEL_CORS_ORIGINS: ${JURAREGEL_CORS_ORIGINS:?JURAREGEL_CORS_ORIGINS is required}
      JURAREGEL_RATE_LIMIT_MODE: ${JURAREGEL_RATE_LIMIT_MODE:?JURAREGEL_RATE_LIMIT_MODE must be ingress}
      LITELLM_URL: ${LITELLM_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      USE_LLM: ${USE_LLM:-false}
      JURAREGEL_CI_MODE: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - juraregel-net

  # ─── JuraRegel Dashboard ──────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: juraregel-dashboard
    ports:
      - "127.0.0.1:${JURAREGEL_DASHBOARD_PORT:-3006}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - juraregel-net

networks:
  juraregel-net:
    driver: bridge
